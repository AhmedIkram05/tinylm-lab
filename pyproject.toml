[project]
name = "tinylm"
version = "0.1.0"
description = "Tiny from-scratch Transformer LM with a minimal reproducible pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinylm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
